# 编译并打包 CPython 3.11.16（Windows x86 / x64）
# 专用工作流：只处理 3.11.16，已去掉多版本推导与手动输入逻辑。
#
# 使用：推送到仓库后，在 Actions 页面点 “Run workflow” 触发（或 push 到主分支自动触发）。
# 产物：Artifacts 中的 python-3.11.16-win32.zip / python-3.11.16-amd64.zip
# 若某架构失败，可在 Artifacts 下载 buildlog-3.11.16-<arch>.log 排查。

name: Build CPython 3.11.16 (Windows x86/x64)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  PY_VER: "3.11.16"
  SRC_DIR: "Python-3.11.16"
  SRC_URL: "https://www.python.org/ftp/python/3.11.16/Python-3.11.16.tar.xz"
  SRC_MD5: ""                  # 可选：填官方 MD5 则下载后校验完整性；留空跳过
  BUILD_HOST_PYTHON: "3.12"    # 仅用于跑构建辅助脚本的“构建主机”，与产物版本无关

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false         # 两个架构独立，一个失败不影响另一个
      matrix:
        include:
          - { name: amd64, platform: x64,   msvc: x64, outdir: amd64, layout_arch: amd64 }
          - { name: win32, platform: Win32, msvc: x86, outdir: win32, layout_arch: win32 }

    steps:
      # ---------------------------------------------------------------
      # 1) 安装构建用主机 Python（跑 regen / PC.layout 等辅助脚本用）
      # ---------------------------------------------------------------
      - name: Setup build host Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BUILD_HOST_PYTHON }}

      # ---------------------------------------------------------------
      # 2) 下载并（可选）校验 3.11.16 源码，解包出 Python-3.11.16
      # ---------------------------------------------------------------
      - name: Download & extract source
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "${{ env.SRC_URL }}"
          Write-Host "Downloading: $url"
          Invoke-WebRequest -Uri $url -OutFile src.tar.xz
          if ("${{ env.SRC_MD5 }}" -ne "") {
            $actual = (Get-FileHash -Algorithm MD5 src.tar.xz).Hash.ToLower()
            Write-Host "MD5 = $actual (expect ${{ env.SRC_MD5 }})"
            if ($actual -ne "${{ env.SRC_MD5 }}".ToLower()) { throw "MD5 mismatch" }
          } else {
            Write-Host "SRC_MD5 empty, skip checksum."
          }
          # windows-2022 自带的 tar.exe 解 .tar.xz 会无输出挂死，改用 runner 自带的 7-Zip。
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $seven)) { throw "7z not found: $seven" }
          # 7z 按压缩包文件名去后缀，src.tar.xz 解出的是 src.tar
          Write-Host "7z extract xz -> src.tar"
          & $seven x src.tar.xz -y
          if ($LASTEXITCODE -ne 0) { throw "7z xz extract failed: $LASTEXITCODE" }
          if (-not (Test-Path "src.tar")) { throw "src.tar not found after xz extract" }
          Write-Host "7z extract tar"
          & $seven x src.tar -y
          if ($LASTEXITCODE -ne 0) { throw "7z tar extract failed: $LASTEXITCODE" }
          Remove-Item src.tar -Force
          if (-not (Test-Path "${{ env.SRC_DIR }}")) { throw "Extract failed: ${{ env.SRC_DIR }} not found" }
          Write-Host "Extracted ${{ env.SRC_DIR }}"

      # ---------------------------------------------------------------
      # 3) 预拉取外部依赖（OpenSSL / Tcl-Tk / sqlite / libffi / expat 等）
      #    build.bat 默认也会自行拉取；这里先拉好并设步级超时+重试，
      #    一旦网络卡死能快速、可见地失败，而不是静默耗满 3 小时。
      # ---------------------------------------------------------------
      - name: Fetch external dependencies (retry, timeout 90m)
        timeout-minutes: 90
        shell: cmd
        working-directory: ${{ env.SRC_DIR }}
        run: |
          setlocal EnableDelayedExpansion
          set RETRIES=3
          :loop
          call PCbuild\get_externals.bat && goto :ok
          set /a RETRIES-=1
          if !RETRIES! gtr 0 (echo RETRY get_externals... & goto :loop)
          echo get_externals failed after retries
          exit /b 1
          :ok
          echo get_externals done

      # ---------------------------------------------------------------
      # 4) 注入 MSVC 编译环境（按架构：x64 / x86）
      # ---------------------------------------------------------------
      - name: Set up MSVC (${{ matrix.msvc }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      # ---------------------------------------------------------------
      # 5) 编译（外部依赖已在第 3 步拉取，build.bat 会复用不再下载）
      #    输出同时写入日志文件，便于失败时排查；步级超时 280 分钟。
      # ---------------------------------------------------------------
      - name: Build CPython (${{ matrix.platform }}) (timeout 280m)
        timeout-minutes: 280
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plat = "${{ matrix.platform }}"
          $log  = "build-${{ matrix.name }}.log"
          Write-Host "Building $plat -> $log"
          $p = Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c PCbuild\build.bat -p $plat -c Release" `
            -RedirectStandardOutput $log -RedirectStandardError "build-${{ matrix.name }}.err" `
            -Wait -NoNewWindow -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "build.bat exited with $($p.ExitCode)" }
          Write-Host "BUILD OK"

      # ---------------------------------------------------------------
      # 6) 冒烟测试：刚编译出的 python.exe 能正常启动
      # ---------------------------------------------------------------
      - name: Smoke test
        shell: cmd
        working-directory: ${{ env.SRC_DIR }}
        run: |
          PCbuild\${{ matrix.outdir }}\python.exe -V

      # ---------------------------------------------------------------
      # 7) 生成可直接运行的 Python 目录（PC/layout）
      #    用刚编好的 python 运行 PC.layout.main，拷贝 Lib/DLLs/pip/idle 等。
      #    continue-on-error：即使本步失败，下一步也会回退打包原始编译产物。
      # ---------------------------------------------------------------
      - name: Create runnable layout
        continue-on-error: true
        shell: cmd
        working-directory: ${{ env.SRC_DIR }}
        run: |
          PCbuild\${{ matrix.outdir }}\python.exe -m PC.layout.main ^
            --source . --build PCbuild\${{ matrix.outdir }} --arch ${{ matrix.layout_arch }} ^
            --copy dist\python-${{ env.PY_VER }}-${{ matrix.name }} ^
            --include-pip --include-idle --include-tcltk --include-venv --include-underpth --include-dev --include-tests

      # ---------------------------------------------------------------
      # 8) 打包为 zip：优先打包 layout 产物，失败则退回原始 PCbuild 输出
      # ---------------------------------------------------------------
      - name: Package (7-Zip)
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Env:PATH += ";C:\Program Files\7-Zip"
          $artifact = "python-${{ env.PY_VER }}-${{ matrix.name }}.zip"
          $layout   = "dist\python-${{ env.PY_VER }}-${{ matrix.name }}"
          $src = if (Test-Path $layout) { $layout } else { "PCbuild\${{ matrix.outdir }}" }
          Write-Host "Packaging from: $src"
          & 7z a -tzip $artifact "$src\*"
          if (-not (Test-Path $artifact)) { throw "zip not created" }

      # ---------------------------------------------------------------
      # 9) 失败时上传编译日志，便于排查
      # ---------------------------------------------------------------
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ env.PY_VER }}-${{ matrix.name }}
          path: ${{ env.SRC_DIR }}/build-${{ matrix.name }}.log
          retention-days: 7

      # ---------------------------------------------------------------
      # 10) 上传最终产物
      # ---------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.PY_VER }}-${{ matrix.name }}
          path: ${{ env.SRC_DIR }}/python-${{ env.PY_VER }}-${{ matrix.name }}.zip
          retention-days: 30
