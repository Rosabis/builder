# Eden Windows 自动构建工作流
# 用途：自动从 https://git.eden-emu.dev/eden-emu/eden.git 拉取代码，编译并打包 Windows 版本。
# 使用：把本文件放到你的仓库 .github/workflows/ 目录下（文件名随意，例如 build-windows.yml），
#       然后在 GitHub Actions 页面手动触发（workflow_dispatch）或按下方触发条件自动运行。
#
# 设计：直接复用 Eden 官方 CI 脚本（.ci/windows/build.sh + package.sh + install-vulkan-sdk.ps1），
#       仅在此之上自动安装 GitHub runner 缺省的工具链（Ninja / Qt6 / Vulkan SDK / MSVC / Python）。
#       这样能正确覆盖 Deps.md 的全部 Windows 依赖（含 Vulkan SDK 与 libusb）。
#
# 注意：
#  - 完整编译较慢（首次 1~3 小时，取决于 CPM/vcpkg 依赖下载），已设 6 小时超时。
#  - 产物为 zip，含 eden.exe + Qt/运行时依赖，可直接解压运行。

name: Build Eden (Windows)

on:
  workflow_dispatch:            # 允许在 Actions 页面手动触发
  push:
    branches: [ main, master ] # 推送到主分支时自动构建
  schedule:
    - cron: '0 6 * * *'        # 每天 UTC 6:00 自动拉取最新代码构建（如不需要可删除本段）

# 防止并发运行占用过多额度
concurrency:
  group: eden-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # ccache（可选）：如需加速重复构建，把 USE_CCACHE 设为 true
      USE_CCACHE: "false"
      # 注意：job 级 env 只允许 github/secrets/vars/needs/inputs/matrix/env 上下文，不能用 runner.*
      CCACHE_DIR: ${{ github.workspace }}/.cache/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros

    steps:
      # ------------------------------------------------------------------
      # 1) 拉取代码（含递归子模块）
      #    git.eden-emu.dev 是公开 Forgejo 实例，用裸 git clone 而非 actions/checkout。
      # ------------------------------------------------------------------
      - name: Clone Eden
        shell: bash
        run: |
          git clone --recursive https://git.eden-emu.dev/eden-emu/eden.git eden
          cd eden
          echo "EDEN_REV=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 2) 安装 Ninja（GitHub Windows runner 默认不含 ninja，build.sh 需要）
      # ------------------------------------------------------------------
      - name: Install Ninja
        shell: pwsh
        run: |
          $url = "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip"
          Invoke-WebRequest -Uri $url -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath "$env:RUNNER_TEMP\ninja" -Force
          "$env:RUNNER_TEMP\ninja" | Out-File -Append -FilePath $env:GITHUB_PATH

      # ------------------------------------------------------------------
      # 3) 安装 Python 3.12（CPM 用 Python 下载/构建第三方依赖，Deps.md 要求 3.10+）
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      # ------------------------------------------------------------------
      # 4) 安装 Qt 6.9.0（提供 Qt 运行时 + windeployqt）
      #    注意：install-qt-action@v4 注入的是 QT_ROOT_DIR（形如 .../6.9.0/msvc2022_64），
      #          不再自动设置 Qt6_DIR；Qt6_DIR 由后续构建/打包步骤用 QT_ROOT_DIR 反推。
      # ------------------------------------------------------------------
      - name: Install Qt 6.9.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: ''
          tools: ''
          cache: true

      # ------------------------------------------------------------------
      # 5) 安装 Vulkan SDK（Deps.md 明确要求：Windows 必须装）
      #    官方脚本会下载 1.4.341.1，并在 GitHub Actions 下自动导出 VULKAN_SDK 与 Bin 路径。
      #    脚本需要管理员权限（GitHub runner 默认具备）。
      # ------------------------------------------------------------------
      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: ${{ github.workspace }}/eden
        run: .\tools\windows\install-vulkan-sdk.ps1

      # ------------------------------------------------------------------
      # 6) 加载 MSVC 编译环境（cl/link/lib 等加入 PATH 与 ENV）
      # ------------------------------------------------------------------
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------------
      # 7) 缓存 CPM / vcpkg / externals 第三方依赖，加速重复构建
      # ------------------------------------------------------------------
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/eden/.cache/cpm
            ${{ github.workspace }}/eden/build/externals
            ${{ github.workspace }}/eden/.vcpkg
            ${{ github.workspace }}/eden/build/vcpkg_installed
          key: ${{ runner.os }}-eden-deps-${{ hashFiles('eden/**/CMakeLists.txt', 'eden/**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-eden-deps-

      # ------------------------------------------------------------------
      # 8) 配置 + 编译（复用官方 .ci/windows/build.sh）
      #    需提供：WINDEPLOYQT 路径、Qt 的 CMAKE_PREFIX_PATH、Qt bin 在 PATH。
      # ------------------------------------------------------------------
      - name: Configure & Build
        shell: bash
        working-directory: ${{ github.workspace }}/eden
        run: |
          set -euxo pipefail

          # install-qt-action@v4 注入的是 QT_ROOT_DIR（形如 .../6.9.0/msvc2022_64），
          # 不再自动设置 Qt6_DIR，需在此自行反推 Qt6 的 CMake 目录与 windeployqt 路径。
          export Qt6_DIR="${QT_ROOT_DIR}/lib/cmake/Qt6"
          QT_BIN="${QT_ROOT_DIR}/bin"
          export PATH="$PATH:$QT_BIN"
          export WINDEPLOYQT="$QT_BIN/windeployqt.exe"
          export CMAKE_PREFIX_PATH="$Qt6_DIR"

          # DEVEL=false 关闭更新检查器（避免额外网络依赖）
          DEVEL=false ./.ci/windows/build.sh

      # ------------------------------------------------------------------
      # 9) 打包（复用官方 .ci/windows/package.sh）
      #    需要 7-Zip；官方脚本用 7z 压缩，这里把 Qt bin 与 7-Zip 加入 PATH。
      #    ARCH 仅用于产物命名。
      # ------------------------------------------------------------------
      - name: Package artifacts
        shell: bash
        working-directory: ${{ github.workspace }}/eden
        env:
          ARCH: x86_64
        run: |
          set -euxo pipefail

          # 与构建步骤一致，先从 QT_ROOT_DIR 反推 Qt bin 目录
          export Qt6_DIR="${QT_ROOT_DIR}/lib/cmake/Qt6"
          QT_BIN="${QT_ROOT_DIR}/bin"
          export PATH="$PATH:$QT_BIN:C:/Program Files/7-Zip"

          ./.ci/windows/package.sh

          ls -lh artifacts/

      # ------------------------------------------------------------------
      # 10) 上传产物
      # ------------------------------------------------------------------
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eden-windows
          path: ${{ github.workspace }}/eden/artifacts/*
          retention-days: 14
